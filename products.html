<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products — Birbal Mart</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F4; --card:#FFFFFF; --ink:#171A1E; --muted:#8A9099; --line:#EBEEED;
  --green:#0C6E4E; --green-hi:#12A374; --gold:#C9A227; --gold-hi:#E8C558; --red:#E23B3B; --amber:#F5A524;
  --catbg1:#FBF6E6; --catbg2:#F3F2EF; --tile:#F5F6F4; --pchip:#FFE9CF; --pchipink:#B5541A;
}
[data-theme="dark"]{
  --bg:#000000; --card:#0C0A06; --ink:#F5EEDA; --muted:#9A8F76; --line:rgba(201,162,39,.24);
  --green:#1FA877; --green-hi:#2ECC8F; --gold:#D4AF37; --gold-hi:#F5DC8E; --red:#F0564F; --amber:#F5C24A;
  --catbg1:#1A1206; --catbg2:#0E0B06; --tile:#100D07; --pchip:#241A08; --pchipink:#F5DC8E;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Poppins",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(96px + env(safe-area-inset-bottom, 0px));-webkit-font-smoothing:antialiased;transition:background .35s,color .35s}
.serif{font-family:"Cinzel",serif}
img{display:block;max-width:100%}
.wrap{max-width:480px;margin:0 auto}
a{color:inherit}

/* HEADER (shared chrome) */
header{background:var(--card);position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.hbar{display:flex;align-items:center;gap:8px;padding:11px 14px 8px}
.backBtn{border:none;background:none;font-size:1.2rem;color:var(--ink);cursor:pointer}
.brand{display:flex;align-items:center;gap:6px}
.brand .cr{font-size:1.2rem}
.brand .bt{font-weight:800;font-size:1rem}
.brand .bt .g{color:var(--green)}.brand .bt .o{color:var(--gold)}
.hsp{flex:1}
.hicon{border:none;background:none;font-size:1.1rem;position:relative;color:var(--ink);cursor:pointer}
.hicon .b{position:absolute;top:-5px;right:-6px;background:var(--red);color:#fff;font-size:.5rem;font-weight:700;border-radius:999px;min-width:14px;height:14px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.searchrow{display:flex;gap:8px;padding:0 14px 10px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:9px 13px}
.search input{flex:1;border:none;outline:none;background:none;font-family:"Poppins";font-size:.83rem;color:var(--ink)}
.search input::placeholder{color:var(--muted)}

/* BREADCRUMB / PAGE TITLE */
.ptitle{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px}
.ptitle h1{font-size:1.05rem;font-weight:700}
.ptitle .cnt{font-size:.68rem;color:var(--muted)}

/* CATEGORY CHIPS (horizontal, current one highlighted) */
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:7px 13px 7px 7px;font-size:.74rem;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap}
.chip img{width:22px;height:22px;border-radius:50%}
.chip.on{background:linear-gradient(100deg,var(--green),var(--green-hi));color:#fff;border-color:transparent}

/* SORT / FILTER BAR */
.sortbar{display:flex;gap:8px;padding:0 14px 10px}
.sortbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px;font-size:.72rem;font-weight:600;color:var(--ink);cursor:pointer}
.sortbtn.on{border-color:var(--gold);color:var(--pchipink)}
[data-theme="dark"] .sortbtn.on{color:var(--gold-hi)}

/* PRODUCT GRID */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:4px 14px 14px}
.pcard{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer;text-decoration:none;display:block}
.pcard .pi{aspect-ratio:1/1;background:var(--tile);display:flex;align-items:center;justify-content:center;font-size:2.9rem;position:relative;overflow:hidden}
.pcard .pi img.photo{width:100%;height:100%;object-fit:cover}
.pcard .tag{position:absolute;top:8px;left:8px;color:#fff;font-size:.53rem;font-weight:700;padding:3px 8px;border-radius:20px}
.tag.hero{background:linear-gradient(100deg,var(--gold),var(--amber));color:#1A1305}
.tag.new{background:var(--green)}
.tag.out{background:#666}
.pcard .heart{position:absolute;top:7px;right:9px;font-size:.9rem;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35);border:none;background:none;cursor:pointer}
.pcard .pin{padding:8px 10px 11px}
.pcard .pn{font-size:.71rem;line-height:1.35;height:1.9em;overflow:hidden;font-weight:500}
.pcard .pr{display:flex;align-items:baseline;justify-content:space-between;margin-top:6px}
.pcard .pp{font-weight:700;font-size:.9rem}
.pcard .rt{font-size:.6rem;color:var(--amber);font-weight:600}
.pcard .meta{font-size:.56rem;color:var(--muted);margin-top:2px;display:flex;gap:6px}
.pcard .meta .cod{color:var(--green);font-weight:600}

/* EMPTY / LOADING STATES */
.state{padding:60px 30px;text-align:center}
.state .em{font-size:2.6rem;margin-bottom:10px}
.state b{display:block;font-size:.92rem;margin-bottom:5px}
.state p{font-size:.75rem;color:var(--muted);line-height:1.5}
.state .btn{display:inline-block;margin-top:14px;background:linear-gradient(100deg,var(--green),var(--green-hi));color:#fff;font-weight:700;font-size:.78rem;border-radius:12px;padding:10px 20px;text-decoration:none}
.skel{background:var(--card);border-radius:14px;overflow:hidden}
.skel .pi{aspect-ratio:1/1;background:linear-gradient(90deg,var(--tile) 25%,var(--line) 50%,var(--tile) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel .pin{padding:10px}
.skel .ln{height:8px;background:var(--tile);border-radius:4px;margin-bottom:6px}
.skel .ln.w60{width:60%}

footer{text-align:center;padding:22px 14px 20px;color:var(--muted);font-size:.66rem;line-height:1.7}

/* FLOATING ASK BIRBAL */
.fab{position:fixed;right:14px;bottom:88px;z-index:65;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:2px}
.fab .ring{width:60px;height:60px;border-radius:50%;overflow:hidden;border:3px solid var(--gold-hi);background:radial-gradient(circle at 50% 30%,#241A08,#0A0805);box-shadow:0 6px 20px rgba(201,162,39,.5),0 0 0 4px rgba(201,162,39,.14);display:flex;align-items:flex-end;justify-content:center;animation:bob 2.8s ease-in-out infinite}
.fab .ring img{width:52px}
.fab .lbl{background:var(--ink);color:var(--bg);font-size:.5rem;font-weight:700;padding:2px 8px;border-radius:20px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){.fab .ring{animation:none}}

/* NAV */
nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(0,0,0,.05);padding-bottom:env(safe-area-inset-bottom, 0px)}
.navin{max-width:480px;margin:0 auto;display:flex;justify-content:space-around;align-items:center;padding:7px 4px 9px}
.ni{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.58rem;color:var(--muted);text-decoration:none;min-width:52px}
.ni svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7}
.ni.on{color:var(--green);font-weight:600}
.ni .aiIco{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 50% 32%,#241A08,#000);border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center}
.ni .aiIco img{width:17px}
.ni.ai.on{color:var(--gold)}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===== THEME =====
function toggleTheme(){
  var h=document.documentElement;
  var dark=h.getAttribute('data-theme')==='dark';
  h.setAttribute('data-theme',dark?'':'dark');
  document.getElementById('themeBtn').textContent=dark?'🌙':'☀️';
  localStorage.setItem('birbal-theme', dark?'light':'dark');
}
(function(){
  var saved = localStorage.getItem('birbal-theme');
  if(saved==='dark'){ document.documentElement.setAttribute('data-theme','dark'); }
})();

// ===== SUPABASE =====
const SUPABASE_URL = "https://szikthydpanliybbpehx.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN6aWt0aHlkcGFubGl5YmJwZWh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwOTc3NjMsImV4cCI6MjA5ODY3Mzc2M30.g8smfp8XJxdXWzE7On6dAJdyiPzR-S_xcYN2m557cCI";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const params = new URLSearchParams(location.search);
let currentCat = params.get('cat') || '';
let currentSort = 'new';
let allProducts = [];

const CAT_EMOJI = {Electronics:'🎧',Fashion:'👗',Beauty:'💄',Watches:'⌚',Shoes:'👞',Home:'🛋️',Kids:'🧸',Sports:'⚽',Automotive:'🚗'};

function updateCartBadge(){
  try{
    const cart = JSON.parse(localStorage.getItem('birbal-cart')||'[]');
    const count = cart.reduce((s,i)=>s+(i.qty||1),0);
    document.getElementById('cartCount').textContent = count;
  }catch(e){}
}
updateCartBadge();

function renderProducts(list){
  const el = document.getElementById('content');
  document.getElementById('resultCount').textContent = list.length ? list.length + ' items' : '';
  if(list.length === 0){
    el.innerHTML = `<div class="state">
      <div class="em">🔍</div>
      <b>Koi product nahi mila</b>
      <p>Is category mein abhi products add ho rahe hain.<br>Jald hi aapko yahan bharpoor options milenge.</p>
      <a class="btn" href="birbal-ai.html">Ask Birbal AI 🤖</a>
    </div>`;
    return;
  }
  el.innerHTML = `<div class="pgrid">` + list.map(p => {
    const emoji = CAT_EMOJI[p.category] || '📦';
    const img = (p.images && p.images.length > 0)
      ? `<img class="photo" src="${p.images[0]}" alt="${p.name}">`
      : emoji;
    const tag = p.badge ? `<span class="tag ${p.badge==='HERO'?'hero':p.badge==='NEW'?'new':''}">${p.badge}</span>` : '';
    const rating = p.rating ? `★ ${p.rating}` : 'New';
    return `<a class="pcard" href="product.html?id=${p.id}">
      <div class="pi">${img}${tag}<button class="heart" onclick="event.preventDefault()">♡</button></div>
      <div class="pin">
        <div class="pn">${p.name}</div>
        <div class="pr"><span class="pp">Rs ${Number(p.price).toLocaleString()}</span><span class="rt">${rating}</span></div>
        <div class="meta"><span class="cod">COD</span><span>${p.delivery_days ? p.delivery_days+' din' : 'In stock'}</span></div>
      </div>
    </a>`;
  }).join('') + `</div>`;
}

function applyFiltersAndRender(){
  let list = [...allProducts];
  if(currentCat) list = list.filter(p => p.category === currentCat);
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  if(q) list = list.filter(p => p.name.toLowerCase().includes(q));
  if(currentSort === 'low') list.sort((a,b) => a.price - b.price);
  else if(currentSort === 'high') list.sort((a,b) => b.price - a.price);
  else list.sort((a,b) => new Date(b.created_at||0) - new Date(a.created_at||0));
  renderProducts(list);
}

async function loadProducts(){
  try{
    const { data, error } = await sb.from('products').select('*').limit(60);
    if(error) throw error;
    allProducts = data || [];
    document.getElementById('pageTitle').textContent = currentCat || 'All Products';
    applyFiltersAndRender();
  }catch(err){
    document.getElementById('content').innerHTML = `<div class="state">
      <div class="em">⚠️</div>
      <b>Products load nahi ho sake</b>
      <p>Internet check karein ya thodi dair mein dobara koshish karein.</p>
      <a class="btn" href="javascript:location.reload()">Try Again</a>
    </div>`;
  }
}

// chip clicks
document.getElementById('chipsRow').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if(!chip) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  chip.classList.add('on');
  currentCat = chip.dataset.cat;
  document.getElementById('pageTitle').textContent = currentCat || 'All Products';
  applyFiltersAndRender();
});
// preset active chip from URL
if(currentCat){
  document.querySelectorAll('.chip').forEach(c => {
    c.classList.toggle('on', c.dataset.cat === currentCat);
  });
}

// sort clicks
document.querySelector('.sortbar').addEventListener('click', (e) => {
  const btn = e.target.closest('.sortbtn');
  if(!btn) return;
  document.querySelectorAll('.sortbtn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  currentSort = btn.dataset.sort;
  applyFiltersAndRender();
});
