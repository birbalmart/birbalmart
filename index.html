<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birbal Mart — Shop Like a King</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F4; --card:#FFFFFF; --ink:#171A1E; --muted:#8A9099; --line:#EBEEED;
  --green:#0C6E4E; --green-hi:#12A374; --gold:#C9A227; --gold-hi:#E8C558; --red:#E23B3B; --amber:#F5A524;
  --catbg1:#FBF6E6; --catbg2:#F3F2EF; --tile:#F5F6F4; --pchip:#FFE9CF; --pchipink:#B5541A;
}
[data-theme="dark"]{
  --bg:#000000; --card:#0C0A06; --ink:#F5EEDA; --muted:#9A8F76; --line:rgba(201,162,39,.24);
  --green:#1FA877; --green-hi:#2ECC8F; --gold:#D4AF37; --gold-hi:#F5DC8E; --red:#F0564F; --amber:#F5C24A;
  --catbg1:#1A1206; --catbg2:#0E0B06; --tile:#100D07; --pchip:#241A08; --pchipink:#F5DC8E;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Poppins",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(96px + env(safe-area-inset-bottom, 0px));-webkit-font-smoothing:antialiased;transition:background .35s,color .35s}
img{display:block;max-width:100%}
.wrap{max-width:480px;margin:0 auto}
.serif{font-family:"Cinzel",serif}

/* HEADER */
header{background:var(--card);position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.hbar{display:flex;align-items:center;gap:8px;padding:11px 14px 8px}
.menuBtn{border:none;background:none;font-size:1.3rem;color:var(--ink);cursor:pointer;padding:0 2px;line-height:1}
.brand{display:flex;align-items:center;gap:6px}
.brand .cr{font-size:1.35rem;filter:drop-shadow(0 1px 3px rgba(201,162,39,.5))}
.brand .bt{font-weight:800;font-size:1.12rem;letter-spacing:-.01em}
.brand .bt .g{color:var(--green)}.brand .bt .o{color:var(--gold)}
.hsp{flex:1}
.hicon{border:none;background:none;font-size:1.15rem;position:relative;color:var(--ink);cursor:pointer}
.hicon .b{position:absolute;top:-5px;right:-6px;background:var(--red);color:#fff;font-size:.52rem;font-weight:700;border-radius:999px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.origins{display:flex;gap:8px;padding:4px 14px 9px}
.origin{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;border-radius:11px;padding:10px;font-weight:600;font-size:.82rem;cursor:pointer;border:1.5px solid var(--line);transition:.2s}
.origin.act{background:linear-gradient(100deg,var(--green),var(--green-hi));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(12,110,78,.25)}
.origin .fl{font-size:1.05rem}
.searchrow{display:flex;gap:8px;padding:0 14px 11px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 13px}
.search input{flex:1;border:none;outline:none;background:none;font-family:"Poppins";font-size:.84rem;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.search .cam{color:var(--green);font-size:.95rem}
.searchBtn{background:linear-gradient(100deg,var(--green),var(--green-hi));color:#fff;border:none;border-radius:12px;padding:0 16px;font-family:"Poppins";font-weight:600;font-size:.8rem;cursor:pointer;display:flex;align-items:center;gap:5px}

/* HERO BANNER (ad-ready carousel) */
.heroWrap{padding:2px 14px 0}
.hero{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:2/1;isolation:isolate}
