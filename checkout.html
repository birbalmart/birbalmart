<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Birbal Mart</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F4;--card:#FFFFFF;--ink:#171A1E;--muted:#8A9099;--line:#EBEEED;--green:#0C6E4E;--green-hi:#12A374;--gold:#C9A227;--gold-hi:#E8C558;--red:#E23B3B;--amber:#F5A524;--tile:#F5F6F4}
[data-theme="dark"]{--bg:#000000;--card:#0C0A06;--ink:#F5EEDA;--muted:#9A8F76;--line:rgba(201,162,39,.24);--green:#1FA877;--green-hi:#2ECC8F;--gold:#D4AF37;--gold-hi:#F5DC8E;--red:#F0564F;--amber:#F5C24A;--tile:#100D07}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Poppins",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:120px;transition:.35s}
.serif{font-family:"Cinzel",serif}
.wrap{max-width:480px;margin:0 auto;padding:0 14px}
header{background:var(--card);position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.hbar{display:flex;align-items:center;gap:10px;padding:12px 14px;max-width:480px;margin:0 auto}
.backBtn,.hicon{border:none;background:none;font-size:1.2rem;color:var(--ink);cursor:pointer}
.hbar .ttl{font-weight:700;font-size:1rem;flex:1}
.sec{background:var(--card);border-radius:14px;padding:15px;margin-top:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.sec h3{font-size:.85rem;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:.68rem;color:var(--muted);margin-bottom:5px;font-weight:500}
.fld input,.fld textarea,.fld select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-family:"Poppins";font-size:.85rem;background:var(--bg);color:var(--ink);outline:none}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--green)}
.fld textarea{resize:vertical;min-height:60px}
.fld .err{color:var(--red);font-size:.62rem;margin-top:4px;display:none}
.fld.bad input,.fld.bad textarea{border-color:var(--red)}
.fld.bad .err{display:block}
.oitem{display:flex;justify-content:space-between;font-size:.76rem;padding:5px 0;color:var(--muted)}
.oitem .n{flex:1;margin-right:10px}
.sr{display:flex;justify-content:space-between;font-size:.8rem;padding:5px 0;color:var(--muted)}
.sr.total{border-top:1px dashed var(--line);margin-top:8px;padding-top:11px;font-size:1.05rem;font-weight:700;color:var(--ink)}
.sr.total b{color:var(--green);font-family:"Cinzel"}
[data-theme="dark"] .sr.total b{color:var(--gold-hi)}
.paybox{display:flex;align-items:center;gap:11px;background:var(--tile);border:1.5px solid var(--green);border-radius:11px;padding:13px}
.paybox .ic{font-size:1.5rem}
.paybox b{font-size:.82rem;display:block}
.paybox small{font-size:.65rem;color:var(--muted)}
.paybox .ck{margin-left:auto;color:var(--green);font-size:1.1rem}
.placebar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(0,0,0,.08);padding:12px 14px;max-width:480px;margin:0 auto}
.placebar .tot{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.placebar .tot small{font-size:.66rem;color:var(--muted)}
.placebar .tot b{font-family:"Cinzel";font-size:1.2rem;color:var(--green)}
[data-theme="dark"] .placebar .tot b{color:var(--gold-hi)}
.placebar .go{width:100%;background:linear-gradient(100deg,var(--green),var(--green-hi));color:#fff;border:none;border-radius:13px;padding:14px;font-family:"Poppins";font-weight:700;font-size:.92rem;cursor:pointer}
.placebar .go:disabled{opacity:.6}
.state{padding:70px 30px;text-align:center}
.state .em{font-size:3rem;margin-bottom:12px}
.state b{display:block;font-size:1rem;margin-bottom:6px}
.state p{font-size:.78rem;color:var(--muted)}
.state a{display:inline-block;margin-top:16px;background:var(--green);color:#fff;font-weight:700;border-radius:12px;padding:11px 24px;text-decoration:none;font-size:.82rem}

.fab-birbal{position:fixed;right:14px;bottom:110px;z-index:65;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:2px}
.fab-birbal .ring{width:58px;height:58px;border-radius:50%;overflow:hidden;border:3px solid var(--gold-hi);background:radial-gradient(circle at 50% 30%,#241A08,#0A0805);box-shadow:0 6px 20px rgba(201,162,39,.5),0 0 0 4px rgba(201,162,39,.14);display:flex;align-items:flex-end;justify-content:center;animation:fabbob 2.8s ease-in-out infinite}
.fab-birbal .ring img{width:50px}
.fab-birbal .lbl{background:var(--ink);color:var(--bg);font-size:.5rem;font-weight:700;padding:2px 8px;border-radius:20px}
@keyframes fabbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){.fab-birbal .ring{animation:none}}
</style>
</head>
<body>
<header><div class="hbar">
  <button class="backBtn" onclick="history.back()">←</button>
  <span class="ttl">Checkout</span>
  <button class="hicon" id="themeBtn" onclick="toggleTheme()">🌙</button>
</div></header>
<div class="wrap" id="page"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
function toggleTheme(){var h=document.documentElement;var d=h.getAttribute('data-theme')==='dark';h.setAttribute('data-theme',d?'':'dark');document.getElementById('themeBtn').textContent=d?'🌙':'☀️';localStorage.setItem('birbal-theme',d?'light':'dark');}
(function(){if(localStorage.getItem('birbal-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');})();
const sb=supabase.createClient("https://szikthydpanliybbpehx.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN6aWt0aHlkcGFubGl5YmJwZWh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwOTc3NjMsImV4cCI6MjA5ODY3Mzc2M30.g8smfp8XJxdXWzE7On6dAJdyiPzR-S_xcYN2m557cCI");
const DELIVERY_FEE=200, FREE_ABOVE=4000;
function getCart(){try{return JSON.parse(localStorage.getItem('birbal-cart')||'[]');}catch(e){return[];}}
const cart=getCart();
const subtotal=cart.reduce((s,i)=>s+i.price*i.qty,0);
const delivery=subtotal>=FREE_ABOVE?0:DELIVERY_FEE;
const total=subtotal+delivery;

if(cart.length===0){
  document.getElementById('page').innerHTML=`<div class="state"><div class="em">🛒</div><b>Cart khali hai</b><p>Checkout se pehle kuch add karein.</p><a href="products.html">Shop Now</a></div>`;
}else{
  document.getElementById('page').innerHTML=`
  <div class="sec">
    <h3>📍 Delivery Details</h3>
    <div class="fld" id="f_name"><label>Poora Naam *</label><input id="name" placeholder="Aapka naam"><div class="err">Naam likhein</div></div>
    <div class="fld" id="f_phone"><label>Phone Number *</label><input id="phone" type="tel" inputmode="numeric" placeholder="03XX-XXXXXXX"><div class="err">Sahi 11-digit number likhein</div></div>
    <div class="fld" id="f_city"><label>Shehar / City *</label><input id="city" placeholder="Jaise: Gujranwala"><div class="err">Shehar likhein</div></div>
    <div class="fld" id="f_address"><label>Poora Pata / Address *</label><textarea id="address" placeholder="Ghar/dukan number, mohalla, area, landmark"></textarea><div class="err">Poora pata likhein</div></div>
    <div class="fld"><label>Note (optional)</label><input id="note" placeholder="Koi khaas hidayat?"></div>
  </div>
  <div class="sec">
    <h3>💳 Payment Method</h3>
    <div class="paybox"><span class="ic">💵</span><div><b>Cash on Delivery</b><small>Maal haath mein le kar paisa dein</small></div><span class="ck">✓</span></div>
  </div>
  <div class="sec">
    <h3>🧾 Order Summary</h3>
    ${cart.map(i=>`<div class="oitem"><span class="n">${i.name} × ${i.qty}</span><span>Rs ${(i.price*i.qty).toLocaleString()}</span></div>`).join('')}
    <div class="sr"><span>Subtotal</span><span>Rs ${subtotal.toLocaleString()}</span></div>
    <div class="sr"><span>Delivery ${delivery===0?'(FREE 🎉)':''}</span><span>Rs ${delivery.toLocaleString()}</span></div>
    <div class="sr total"><span>Total</span><b>Rs ${total.toLocaleString()}</b></div>
  </div>`;

  const bar=document.createElement('div');
  bar.className='placebar';
  bar.innerHTML=`<div class="tot"><span><small>Total (COD)</small></span><b>Rs ${total.toLocaleString()}</b></div><button class="go" id="placeBtn">🛍️ Place Order</button>`;
  document.body.appendChild(bar);
  document.getElementById('placeBtn').addEventListener('click',placeOrder);
}

function val(id){return (document.getElementById(id)||{}).value?.trim()||'';}
function markBad(fid,bad){const el=document.getElementById(fid);if(el)el.classList.toggle('bad',bad);}

async function placeOrder(){
  const name=val('name'),phone=val('phone'),city=val('city'),address=val('address'),note=val('note');
  let ok=true;
  markBad('f_name',!name); if(!name)ok=false;
  const phoneOk=/^0\d{10}$/.test(phone.replace(/[-\s]/g,'')); markBad('f_phone',!phoneOk); if(!phoneOk)ok=false;
  markBad('f_city',!city); if(!city)ok=false;
  markBad('f_address',address.length<8); if(address.length<8)ok=false;
  if(!ok){window.scrollTo({top:0,behavior:'smooth'});return;}

  const btn=document.getElementById('placeBtn');
  btn.disabled=true; btn.textContent='Order ja raha hai…';

  const orderNo='BM'+Date.now().toString().slice(-8);
  const order={
    order_number:orderNo,
    customer_name:name,
    phone:phone.replace(/[-\s]/g,''),
    city:city,
    address:address+(note?(' | Note: '+note):''),
    items:cart,
    subtotal:subtotal,
    delivery_fee:delivery,
    total:total,
    payment_method:'COD',
    status:'pending',
    escrow_status:'not_applicable'
  };
  try{
    const {error}=await sb.from('orders').insert([order]);
    if(error)throw error;
    localStorage.removeItem('birbal-cart');
    localStorage.setItem('birbal-last-order',JSON.stringify({order_number:orderNo,total:total,name:name}));
    location.href='order-confirmation.html';
  }catch(err){
    btn.disabled=false; btn.textContent='🛍️ Place Order';
    alert('Order save nahi hua. Internet check karein aur dobara koshish karein.\n\n('+(err.message||'error')+')');
  }
}
</script>
